<div class="w-full max-w-container-max flex flex-col md:flex-row bg-surface rounded-[24px] shadow-sm overflow-hidden min-h-[600px]">

<div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
<div class="absolute bottom-stack-lg left-gutter text-on-primary">
<h2 class="font-headline-md text-headline-md mb-stack-sm text-white drop-shadow-md">Curate Your Style</h2>
<p class="font-body-md text-body-md text-white/90 drop-shadow-md max-w-sm">Welcome to your digital wardrobe concierge. Discover pieces that perfectly match your aesthetic.</p>
</div>
</div>
<!-- Right Side: Form -->
<div class="w-full md:w-1/2 flex flex-col justify-center p-stack-lg bg-surface">
<div class="mb-stack-lg text-center md:text-left">
<h1 class="font-display-lg text-display-lg text-primary mb-stack-sm">WearWell</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Welcome back. Please enter your details.</p>
</div>
<form class="space-y-stack-md w-full max-w-md mx-auto md:mx-0">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base uppercase tracking-wider" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full bg-surface-container-lowest border border-surface-variant rounded-full py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors shadow-sm" id="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full bg-surface-container-lowest border border-surface-variant rounded-full py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors shadow-sm" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded text-primary" id="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-md text-label-md text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-[16px] shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all hover:scale-[1.01] active:scale-[0.99]" type="button">
                        Sign in
                    </button>
</div>
<div class="relative my-stack-md">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="w-full flex justify-center items-center py-3 px-4 border border-surface-variant rounded-[16px] shadow-sm bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined mr-2 text-[20px]">cruelty_free</span> Google
                    </button>
<button class="w-full flex justify-center items-center py-3 px-4 border border-surface-variant rounded-[16px] shadow-sm bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined mr-2 text-[20px]">file_download</span> Apple
                    </button>
</div>
</form>
<p class="mt-stack-lg text-center md:text-left font-body-md text-body-md text-on-surface-variant">
                Don't have an account? <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Sign up</a>
</p>
</div>
