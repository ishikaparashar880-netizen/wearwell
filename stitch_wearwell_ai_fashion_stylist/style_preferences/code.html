<style>
        /* Custom utilities to supplement Tailwind where needed for specific animations */
        .style-card {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateZ(0);
        }
        .style-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
            pointer-events: none;
            z-index: 20;
        }
        .style-card.selected {
            transform: scale(0.98);
        }
        .style-card.selected::after {
            border-color: #431830; /* Primary */
        }
        .style-card .overlay {
            background: linear-gradient(to top, rgba(28, 28, 25, 0.8) 0%, rgba(28, 28, 25, 0) 60%);
        }
        .check-icon {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .style-card.selected .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        
        /* Hide scrollbar for a cleaner look while maintaining functionality */
        ::-webkit-scrollbar {
            width: 8px;

<img class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="Refined, understated evening glamour. The photograph features a sweeping, minimalist slip dress in a subtle metallic rose-gold or deep plum silk that catches the light elegantly. The setting is intimate and softly illuminated, like a high-end private lounge at dusk, avoiding harsh flash photography. The mood is sensual yet sophisticated, focusing on the tactile drape of the luxurious fabric and a sense of quiet confidence. It perfectly embodies a warm, sophisticated, high-end digital concierge vibe." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzRClW2uVMlFdphz13lL0vE1sjfpDb_TZo1HQd1nUagGruFMjiawJjt1L40pdt9dz5cqoQYtQB8h2OaAd5P00w1Nt-dpCrmG1sgPFs15BUF2wXytbnNDnv-FOCBRJN2F5Y-_2AZAnk6jD3SilE47-mXXFnvnlES5QbcgTRq8ENfJ5bHyeWvj_R43CI5UAdxQ7K5xVSFW3kLgWLAJBcDqNU57uFc2QwerSy_Fv2K_IuDM63Iwk-Ta163Q"/>
<div class="overlay absolute inset-0 z-10 transition-opacity duration-300 group-hover:opacity-90"></div>

</main>
<!-- Bottom Navigation Bar (Fixed) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-surface-container-highest z-50 py-4 px-margin-mobile md:px-gutter">
<div class="max-w-container-max mx-auto flex justify-between items-center">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary px-4 py-2 transition-colors duration-200 focus:outline-none" type="button">
                Skip for now
            </button>
<button class="font-label-md text-label-md bg-surface-container-highest text-on-surface-variant px-8 py-3 rounded-xl transition-all duration-300 opacity-70 cursor-not-allowed" disabled="" id="continueBtn" type="button">
                Continue
            </button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.style-card');
            const continueBtn = document.getElementById('continueBtn');
            const selectedStyles = new Set();

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const styleId = card.getAttribute('data-style-id');
                    
                    if (selectedStyles.has(styleId)) {
                        selectedStyles.delete(styleId);
                        card.classList.remove('selected');
                        card.setAttribute('aria-pressed', 'false');
                    } else {
                        selectedStyles.add(styleId);
                        card.classList.add('selected');
                        card.setAttribute('aria-pressed', 'true');
                    }

                    updateContinueButton();
                });
            });

            function updateContinueButton() {
                if (selectedStyles.size > 0) {
                    continueBtn.removeAttribute('disabled');
                    continueBtn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant', 'opacity-70', 'cursor-not-allowed');
                    continueBtn.classList.add('bg-primary', 'text-on-primary', 'hover:shadow-md', 'hover:bg-primary/90', 'cursor-pointer');
                    
                    // Simple tactile lift effect on activation
                    continueBtn.style.transform = 'scale(1.02)';
                    setTimeout(() => { continueBtn.style.transform = 'scale(1)'; }, 150);
                } else {
                    continueBtn.setAttribute('disabled', 'true');
                    continueBtn.classList.add('bg-surface-container-highest', 'text-on-surface-variant', 'opacity-70', 'cursor-not-allowed');
                    continueBtn.classList.remove('bg-primary', 'text-on-primary', 'hover:shadow-md', 'hover:bg-primary/90', 'cursor-pointer');
                }
            }
        });
    </script>
</body></html>
